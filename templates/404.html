{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center glass p-5 glass-hover">
        <h1 class="display-1 fw-bold text-gradient mb-3">404</h1>
        <h2 class="h3 mb-4">Oops! Page not found</h2>
        <p class="text-secondary mb-5">The page you are looking for might have been removed, had its name changed, or is
            temporarily unavailable.</p>
        <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg rounded-pill px-5">
            <i class="fas fa-home me-2"></i>Take me home
        </a>
    </div>
</div>
{% endblock %}
